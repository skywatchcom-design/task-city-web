<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>SkyTasks · הדף לא נמצא</title>

<style>
/* Cloudflare Pages answers an unknown address with this page and a real 404 (seo-basics, 3.11). Without it every
   address answered 200 with the landing page, robots.txt and sitemap.xml included, which search engines count as
   duplicate pages. Same calm day look as the landing page. */
:root{--bg:#F7F7F4;--ink:#1D2B55;--sub:#4A5268;--sun:#E0A63A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.6 Assistant,system-ui,sans-serif;padding:24px 16px}
main{max-width:420px;text-align:center}
h1{font:800 30px/1.2 Rubik,system-ui,sans-serif;margin:0 0 10px}
.rail{display:flex;flex-direction:column;gap:4px;width:56px;margin:0 auto 18px}
.rail i{display:block;height:3px;background:var(--sun);border-radius:2px}
p{color:var(--sub);margin:0 0 24px}
a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:22px 22px 22px 6px}
</style>
</head>
<body>
<main>
  <h1>הדף הזה לא נמצא</h1>
  <div class="rail"><i></i><i></i><i></i></div>
  <p>אולי הקישור השתנה. כל מה שיש לנו נמצא בדף הבית.<br><span dir="ltr">This page does not exist.</span></p>
  <a href="/">לדף הבית של SkyTasks</a>
</main>
</body>
