<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SkyTasks city</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:transparent}
  #c{display:block;width:100%;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  /* The app's pills (lib/ui/look.dart): white card, thin line, one rounded corner like a balcony. */
  .pills{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  body[dir=ltr] .pills{right:auto;left:8px;align-items:flex-start}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:#FFFFFF;color:#17181A;border:1px solid #E3E3DE;border-radius:4px;border-end-end-radius:14px;font:700 13px Rubik,Assistant,system-ui,sans-serif;box-shadow:0 2px 6px rgba(29,43,85,.08);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  body.night .pill{background:#18223A;color:#F3F1EA;border-color:#2A3550}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pills">
  <div class="pill" id="btnTop"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg><span>למעלה</span></div>
  <div class="pill" id="btnStreet"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="1.5"/><path d="M11 8l3 2 2 4M9 21l3-8 3 3v5M10 13l-3 2"/></svg><span>לרחוב</span></div>
</div>
<script src="three.min.js"></script>
<script src="tex.js"></script>
<script src="city.js"></script>
<script>
  // Open as a plain page (not from Flutter): ?demo shows a sample city, for sketches and checks.
  if (location.search.indexOf('demo') >= 0) {
    const s = document.createElement('script'); s.src = 'demo.js'; document.body.appendChild(s);
  }
</script>
</body>
</html>
