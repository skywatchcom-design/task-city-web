<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyTasks, להורדה</title>
<meta name="description" content="SkyTasks: להורדה באייפון, וגרסת בדיקה באנדרואיד.">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@700;800&display=swap">
<style>
/* The one link we share everywhere (launch kit, 26.10): an iPhone goes straight to the App Store; an Android phone
   gets a form for their Gmail address, which our server emails to us (we add them to the closed test and reply with the link); a computer sees both. Same A+E language as the app and the landing page. */
:root{--bg:#F7F7F4;--ink:#1D2B55;--sub:#5C6683;--line:#E2E1DA;--card:#FFFFFF;--sun:#E0A63A;--brand:#1D2B55;
  --f-head:"Rubik","Assistant",system-ui,sans-serif;--f-body:"Assistant","Rubik",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--ink:#E8ECF6;--sub:#9AA4C0;--line:#263049;--card:#172036;--sun:#F2C14E;--brand:#F2C14E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
.in{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:flex-end;gap:4px;height:30px}
.mark i{display:block;width:11px;background:var(--ink)}
.mark i:nth-child(1){height:15px}.mark i:nth-child(2){height:22px}.mark i:nth-child(3){height:30px;position:relative}
.mark i:nth-child(3)::after{content:"";position:absolute;top:5px;left:3px;width:5px;height:5px;background:var(--sun)}
.word{font:800 24px var(--f-head);letter-spacing:-.3px}
.lang{display:flex;gap:4px}
.lang button{font:600 13px var(--f-body);color:var(--sub);background:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
h1{font:800 28px/1.2 var(--f-head);margin:28px 0 6px;text-wrap:balance}
.rail{display:flex;gap:4px;margin:6px 0 18px}.rail i{width:20px;height:4px;border-radius:2px;background:var(--sun)}
.lead{color:var(--sub);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;padding:18px 18px 20px;margin-top:16px}
[dir="ltr"] .card{border-radius:22px 22px 6px 22px}
.card h2{font:800 20px var(--f-head);margin:0 0 4px}
.card p{margin:0 0 14px;color:var(--sub);font-size:15.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:6px 22px 6px 6px;background:#111;color:#fff;font:700 17px var(--f-head);text-decoration:none}
.btn.and{background:var(--brand);color:var(--bg)}
.btn svg{width:22px;height:22px}
.btn:focus-visible,.step a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#1D2B55;font:800 15px var(--f-head)}
.step div{min-width:0}
.step b{display:block;font-size:16px}
.step a{display:inline-block;margin-top:4px;font-weight:700;color:var(--ink);text-underline-offset:3px}
.note{font-size:14px;color:var(--sub);margin-top:14px}
.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
#mail{display:block;width:100%;min-height:50px;margin-bottom:10px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:17px var(--f-body);text-align:left}
#mail:focus{outline:none;border-color:var(--ink)}
#mail[aria-invalid="true"]{border-color:#C0392B}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);opacity:0}
button.btn{width:100%;border:0;cursor:pointer}
button.btn[disabled]{opacity:.6;cursor:default}
.msg{margin:8px 0 0;font-size:14.5px;color:#C0392B}
.msg:empty{display:none}
.done{border-inline-start:4px solid var(--sun);padding:4px 12px;margin-bottom:18px}
.done b{font:800 18px var(--f-head)}
.done p{margin:4px 0 0}
.foot{margin-top:28px;font-size:14px;color:var(--sub);display:flex;flex-wrap:wrap;gap:14px}
.foot a{color:var(--sub)}
</style>
</head>
<body>
<div class="in">
  <div class="top">
    <div style="display:flex;align-items:flex-end;gap:10px"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="word" dir="ltr">SkyTasks.</span></div>
    <div class="lang" role="group" aria-label="Language"><button id="bHe" aria-pressed="true">עברית</button><button id="bEn" aria-pressed="false">English</button></div>
  </div>
  <h1 data-he="המשימות שלך, והעיר שהן בונות" data-en="Your tasks, and the city they build"></h1>
  <div class="rail"><i></i><i></i><i></i></div>
  <p class="lead" data-he="בחרו את הטלפון שלכם." data-en="Pick your phone."></p>

  <section class="card" id="ios">
    <h2 data-he="אייפון ואייפד" data-en="iPhone and iPad"></h2>
    <p data-he="חינם, בעברית ובאנגלית." data-en="Free, in Hebrew and English."></p>
    <a class="btn" id="appStore" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span data-he="להורדה ב־App Store" data-en="Download on the App Store"></span></a>
  </section>

  <section class="card" id="android">
    <h2 data-he="אנדרואיד: גרסת בדיקה" data-en="Android: test version"></h2>
    <p data-he="באנדרואיד SkyTasks עוד בבדיקה של גוגל פליי. כתבו כאן את הג'ימייל שאיתו אתם נכנסים לגוגל פליי, ונשלח אליו קישור להורדה." data-en="On Android, SkyTasks is still in Google Play testing. Type the Gmail address you use on Google Play, and we will send the download link to it."></p>
    <form id="ask" novalidate>
      <label for="mail" class="lbl" data-he="הג'ימייל שלך" data-en="Your Gmail"></label>
      <input id="mail" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@gmail.com" required>
      <input id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
      <button class="btn and" id="send" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg><span data-he="לבקש להצטרף לבדיקה" data-en="Ask to join the test"></span></button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div id="done" class="done" hidden>
      <b data-he="קיבלנו!" data-en="Got it!"></b>
      <p><span data-he="נוסיף אותך לבדיקה ונשלח קישור להורדה אל " data-en="We will add you to the test and send the download link to "></span><span dir="ltr" id="doneMail"></span><span data-he=", בדרך כלל עוד היום." data-en=", usually today."></span></p>
    </div>
    <p class="note"><span data-he="אפשר גם לכתוב לנו ישירות: " data-en="You can also write to us: "></span><span dir="ltr">skywatchcom@gmail.com</span></p>
  </section>

  <div class="foot">
    <a href="../soon/" data-he="על SkyTasks" data-en="About SkyTasks"></a>
    <a href="../privacy.html" data-he="מדיניות פרטיות" data-en="Privacy policy"></a>
    <span dir="ltr">skywatchcom@gmail.com</span>
  </div>
</div>
<script src="../launch.js"></script>
<script>
(function(){
  var S=window.SKY||{};
  // Until launch day the store pages are not open yet: the landing page says "coming soon".
  if(!S.live){location.replace('../soon/');return;}
  var ua=navigator.userAgent||'';
  var apple=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var android=/Android/.test(ua);
  // An iPhone or iPad goes straight to the App Store; "#android" (from the landing page) always shows the steps.
  if(apple&&location.hash!=='#android'){location.replace(S.appStore);return;}
  document.getElementById('appStore').href=S.appStore;
  if(android||location.hash==='#android'){document.getElementById('ios').hidden=true;document.querySelector('.lead').hidden=true;}
  var r=document.documentElement;
  function set(l){
    r.lang=l;r.dir=l==='he'?'rtl':'ltr';
    document.querySelectorAll('[data-he]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
    document.getElementById('bHe').setAttribute('aria-pressed',l==='he');
    document.getElementById('bEn').setAttribute('aria-pressed',l==='en');
    document.title=l==='he'?'SkyTasks, להורדה':'SkyTasks, download';
    lang=l;
  }
  var lang='he',form=document.getElementById('ask'),mail=document.getElementById('mail'),msg=document.getElementById('msg'),send=document.getElementById('send');
  function say(he,en){msg.textContent=lang==='he'?he:en}
  // The request goes to our server (the tester-request function), which emails it to us: no mail app on the phone needed.
  form.onsubmit=function(e){
    e.preventDefault();
    var v=mail.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)){mail.setAttribute('aria-invalid','true');say('צריך כתובת מייל מלאה, למשל name@gmail.com','A full email address, like name@gmail.com');mail.focus();return;}
    mail.removeAttribute('aria-invalid');msg.textContent='';send.disabled=true;
    fetch(S.testerRequest,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:v,lang:lang,website:document.getElementById('website').value})})
      .then(function(r){if(!r.ok)throw r.status;
        form.hidden=true;document.getElementById('doneMail').textContent=v;document.getElementById('done').hidden=false;})
      .catch(function(){send.disabled=false;
        say('לא הצלחנו לשלוח. נסו שוב, או כתבו לנו ל־skywatchcom@gmail.com','Could not send. Try again, or write to skywatchcom@gmail.com');});
  };
  document.getElementById('bHe').onclick=function(){set('he')};
  document.getElementById('bEn').onclick=function(){set('en')};
  set(/^he|^iw/.test(navigator.language||'he')?'he':'en');
})();
</script>
</body>
</html>
