<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SkyTasks: לעקוב אחרי המשימות בכיף, ובאמת לעמוד בהן. בקרוב באנדרואיד ובאייפון.">
<link rel="icon" href="../favicon.png">
<title>SkyTasks Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one calm day-only column. Header, hero (text beside the real city, store badges), six feature tiles, family teaser, footer. Same A+E design language as the app. */
:root{--bg:#F7F7F4;--ink:#1B2133;--sub:#5C6275;--line:#DCDCD4;--card:#FFFFFF;--brand:#1D2B55;--sun:#E0A63A;
--f-head:'Rubik','Assistant',system-ui,sans-serif;--f-body:'Assistant','Rubik',system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.rail{display:flex;gap:5px;margin-top:14px}.rail i{width:26px;height:5px;background:var(--sun);border-radius:1px}
header .in{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.logo{height:34px;width:auto;display:block}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font:600 14px var(--f-body);color:var(--sub);background:none;border:0;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero .in{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;align-items:center;padding-block:24px 48px}
.hero h1{font-size:clamp(32px,5vw,52px)}
.lead{font-size:19px;color:var(--sub);margin-top:18px;max-width:34ch}
.stores{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.heroimg{position:relative}
.heroimg img{width:100%;height:auto;display:block}
.heroimg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feat .in{padding-block:8px 56px}
.feat h2{font-size:clamp(26px,3.6vw,36px);text-align:center}
.feat .rail{justify-content:center;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:6px 24px 6px 6px;padding:20px}
[dir="ltr"] .tile{border-radius:24px 6px 6px 6px}
.ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.tile h3{font-size:18px}
.tile p{margin-top:4px;color:var(--sub);font-size:15px;line-height:1.45}
.family .in{padding-block:8px 56px;display:flex;justify-content:center}
.fam{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;text-align:center;background:var(--brand);color:#fff;border-radius:6px 32px 6px 6px;padding:28px 24px;max-width:720px}
.fam h2{font-size:24px}.fam p{color:#D7DCEE;margin-top:6px;font-size:16px}
.tag{font:700 13px var(--f-head);color:var(--brand);background:var(--sun);padding:5px 14px;border-radius:999px}
footer{border-top:1.5px solid var(--line)}
footer .in{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-block:24px;font-size:15px;color:var(--sub)}
footer a{color:var(--ink)}
.copy{unicode-bidi:plaintext;user-select:all}
.store{display:flex;align-items:center;gap:12px;min-width:170px;padding:12px 22px;border-radius:6px 22px 6px 6px;background:var(--brand);color:#fff}
[dir="ltr"] .store{border-radius:22px 6px 6px 6px}
.store svg{width:30px;height:30px;flex:none}
.store span{display:flex;flex-direction:column;line-height:1.15}
.store small{font-size:12px;opacity:.8}
.store b{font:700 17px var(--f-head)}
.store.apple{background:#111}
@media (max-width:860px){.hero .in{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.heroimg{order:-1}}
@media (max-width:380px){.logo{height:26px}.lang button{padding:6px 10px}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.store{flex:1 1 100%}}
@media (prefers-reduced-motion:no-preference){.heroimg img{animation:rise .6s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
