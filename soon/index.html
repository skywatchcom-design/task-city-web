<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SkyTasks: המשימות, היומן והלימודים במקום אחד, ועיר שנבנית ממה שעשית. בקרוב באנדרואיד ובאייפון.">
<link rel="icon" href="../favicon.png">
<title>SkyTasks Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one calm day-only column. Header, hero (text beside the real city, store badges), the launch video, nine feature tiles, family teaser, footer. Same A+E design language as the app. */
:root{--bg:#F7F7F4;--ink:#1B2133;--sub:#5C6275;--line:#DCDCD4;--card:#FFFFFF;--brand:#1D2B55;--sun:#E0A63A;
--f-head:'Rubik','Assistant',system-ui,sans-serif;--f-body:'Assistant','Rubik',system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.rail{display:flex;gap:5px;margin-top:14px}.rail i{width:26px;height:5px;background:var(--sun);border-radius:1px}
header .in{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.logo{height:34px;width:auto;display:block}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font:600 14px var(--f-body);color:var(--sub);background:none;border:0;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero .in{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;align-items:center;padding-block:24px 48px}
.hero h1{font-size:clamp(32px,5vw,52px)}
.lead{font-size:19px;color:var(--sub);margin-top:18px;max-width:34ch}
.stores{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.heroimg{position:relative}
.heroimg img{width:100%;height:auto;display:block}
.watch .in{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;padding-block:16px 64px}
.watch h2{font-size:clamp(26px,3.6vw,36px)}
.watch p{margin-top:16px;color:var(--sub);max-width:36ch}
.phone{width:300px;max-width:100%;padding:10px;border-radius:44px;background:var(--ink);box-shadow:0 24px 50px rgba(27,33,51,.22)}
.phone video{display:block;width:100%;height:auto;aspect-ratio:9/16;border-radius:34px;background:#000}
.feat .in{padding-block:8px 56px}
.feat h2{font-size:clamp(26px,3.6vw,36px);text-align:center}
.feat .rail{justify-content:center;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:6px 24px 6px 6px;padding:20px}
[dir="ltr"] .tile{border-radius:24px 6px 6px 6px}
.ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.tile h3{font-size:18px}
.tile p{margin-top:4px;color:var(--sub);font-size:15px;line-height:1.45}
.family .in{padding-block:8px 56px;display:flex;justify-content:center}
.fam{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;text-align:center;background:var(--brand);color:#fff;border-radius:6px 32px 6px 6px;padding:28px 24px;max-width:720px}
.fam h2{font-size:24px}.fam p{color:#D7DCEE;margin-top:6px;font-size:16px}
.tag{font:700 13px var(--f-head);color:var(--brand);background:var(--sun);padding:5px 14px;border-radius:999px}
footer{border-top:1.5px solid var(--line)}
footer .in{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;padding-block:24px;font-size:15px;color:var(--sub)}
footer a{color:var(--ink)}
.copy{unicode-bidi:plaintext;user-select:all}
.store{display:flex;align-items:center;gap:12px;min-width:170px;padding:12px 22px;border-radius:6px 22px 6px 6px;background:var(--brand);color:#fff}
[dir="ltr"] .store{border-radius:22px 6px 6px 6px}
.store svg{width:30px;height:30px;flex:none}
.store span{display:flex;flex-direction:column;line-height:1.15}
.store small{font-size:12px;opacity:.8}
.store b{font:700 17px var(--f-head)}
.store.apple{background:#111}
a.store{text-decoration:none;cursor:pointer}a.store:hover{filter:brightness(1.12)}a.store:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
@media (max-width:860px){.watch .in{grid-template-columns:1fr;justify-items:center;text-align:center}.watch .rail{justify-content:center}.watch p{margin-inline:auto}.hero .in{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.heroimg{order:-1}}
@media (max-width:380px){.logo{height:26px}.lang button{padding:6px 10px}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.store{flex:1 1 100%}}
@media (prefers-reduced-motion:no-preference){.heroimg img{animation:rise .6s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<header><div class="in">
  <img class="logo" alt="SkyTasks" src="logo.png" width="140" height="28">
  <div class="lang" role="group" aria-label="Language"><button id="bHe" aria-pressed="true">עברית</button><button id="bEn" aria-pressed="false">English</button></div>
</div></header>
<main>
<section class="hero"><div class="in">
  <div>
    <h1 data-he="המשימות, היומן והלימודים, במקום אחד" data-en="Your tasks, calendar and studies, in one place"></h1>
    <div class="rail"><i></i><i></i><i></i></div>
    <p class="lead" data-he="כותבים משפט אחד, מקבלים תזכורת בזמן, והיומנים שלך מתחברים. וכל משימה ולו&quot;ז שעומדים בהם בונים לך את העיר." data-en="Write one sentence, get reminded on time, and your calendars connect. Every task and plan you keep builds your city."></p>
    <div class="stores">
      <div class="store" id="sAndroid"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon fill="#00A0FF" points="3,2 13.2,12 3,22"/><polygon fill="#00E676" points="3,2 16.5,9.5 13.2,12"/><polygon fill="#FFD400" points="16.5,9.5 21,12 16.5,14.5 13.2,12"/><polygon fill="#FF3D57" points="3,22 13.2,12 16.5,14.5"/></svg><span><small data-he="בקרוב" data-en="Coming soon"></small><b data-he="אנדרואיד" data-en="Android"></b></span></div>
      <div class="store apple" id="sApple"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span><small data-he="בקרוב" data-en="Coming soon"></small><b data-he="אייפון" data-en="iPhone"></b></span></div>
    </div>
  </div>
  <div class="heroimg"><img alt="" src="city.webp" width="1290" height="961"></div>
</div></section>
<section class="watch"><div class="in">
  <div class="watchtext">
    <h2 data-he="25 שניות על SkyTasks" data-en="SkyTasks in 25 seconds"></h2>
    <div class="rail"><i></i><i></i><i></i></div>
    <p data-he="עיר שגדלה ממה שעשית, משפט אחד שמסתדר לבד, תזכורת בזמן, יומנים שמתחברים, ומערכת שעות עם מבחנים." data-en="A city that grows from what you do, one sentence that sorts itself out, a reminder on time, calendars that connect, and a timetable with exams."></p>
  </div>
  <div class="phone"><video id="launch" src="launch.mp4" poster="launch-poster.jpg" controls playsinline preload="metadata"></video></div>
</div></section>
<section class="feat"><div class="in">
  <h2 data-he="הכול כדי שתעמדו במשימות" data-en="Everything to help you follow through"></h2>
  <div class="rail"><i></i><i></i><i></i></div>
  <div class="grid"><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></span><div><h3 data-he="משפט אחד, גם בקול" data-en="One sentence, by voice too"></h3><p data-he="כותבים או אומרים &quot;מחר בעשר רופא שיניים&quot;. האפליקציה מבינה יום, שעה, חזרה ושכונה." data-en="Type or say &quot;dentist tomorrow at 10&quot;. It picks up the day, time, repeat and neighbourhood."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg></span><div><h3 data-he="תזכורות בזמן" data-en="Reminders on time"></h3><p data-he="התראה לפני כל משימה, ו&quot;בוצע&quot; או &quot;עוד 15 דקות&quot; ישר מההתראה." data-en="A nudge before each task, with Done or 15 more minutes right in the notification."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><div><h3 data-he="יומן ומשימות במקום אחד" data-en="Calendar and tasks together"></h3><p data-he="יומני גוגל, iCloud ו־Outlook שבטלפון מתחברים בשני הכיוונים, בצורה מאובטחת. רואים יום, 3 ימים, שבוע או חודש." data-en="Your phone calendars (Google, iCloud, Outlook) connect both ways, securely. Day, 3 days, week and month."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5M9 7h7M9 11h5"/></svg></span><div><h3 data-he="מערכת שעות ומבחנים" data-en="Timetable and exams"></h3><p data-he="מערכת שמדלגת לבד על חגים, ספירה לאחור לכל מבחן, וזמני למידה בשעות הפנויות." data-en="A timetable that skips holidays by itself, a countdown to every exam, and study time in your free hours."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l4-2v14M9 21V4l6 3v14M15 21v-9l4 2v7"/></svg></span><div><h3 data-he="עיר שנבנית ממה שעשית" data-en="A city built from what you do"></h3><p data-he="כל משימה ולו&quot;ז שעומדים בהם בונים לך את העיר. אפשר להיכנס אליה ולהסתובב ברחובות." data-en="Every task and plan you keep builds your city. Zoom in and walk its streets."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><div><h3 data-he="ווידג'טים למסך הבית" data-en="Home screen widgets"></h3><p data-he="היום, המשימה הבאה וההתקדמות על המסך, ו&quot;בוצע&quot; בנגיעה, בלי לפתוח." data-en="Today, what is next and your progress on screen, with Done in one tap."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10M10 20v-5h4v5"/></svg></span><div><h3 data-he="בית משותף" data-en="A shared home"></h3><p data-he="בית אחד לבני זוג או לשותפים: מטלות, קניות ותזכורות אחד לשני." data-en="One home for partners or flatmates: chores, shopping and reminders for each other."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span><div><h3 data-he="מצב קשב וריכוז" data-en="Focus mode"></h3><p data-he="כשקשה להתחיל: משימה אחת, צעד ראשון קטן וטיימר שרואים אותו נגמר." data-en="When starting is hard: one task, a small first step and a timer you can watch run down."></p></div></div><div class="tile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><div><h3 data-he="חינם ובלי פרסומות" data-en="Free, no ads"></h3><p data-he="בעברית ובאנגלית, ובלי שום דבר שמפריע." data-en="In Hebrew and English, with nothing in the way."></p></div></div></div>
</div></section>
<section class="family"><div class="in"><div class="fam">
  <span class="tag" data-he="בקרוב" data-en="Coming soon"></span>
  <div><h2 data-he="מצב משפחה" data-en="Family mode"></h2><p data-he="ההורה מכניס משימה, הילד מסמן שסיים, וההורה מאשר." data-en="A parent adds a task, the child marks it done, the parent approves."></p></div>
</div></div></section>
</main>
<footer><div class="in">
  <span>© SkyTasks</span>
  <a href="https://skywatchcom-design.github.io/task-city-web/privacy.html" data-he="מדיניות פרטיות" data-en="Privacy policy"></a>
  <span><span data-he="יצירת קשר: " data-en="Contact: "></span><span class="copy" dir="ltr">skywatchcom@gmail.com</span></span>
</div></footer>
<script src="../launch.js"></script>
<script>
(function(){
  var r=document.documentElement;
  function set(l){
    r.lang=l; r.dir=l==='he'?'rtl':'ltr';
    document.querySelectorAll('[data-he]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
    document.getElementById('bHe').setAttribute('aria-pressed',l==='he');
    document.getElementById('bEn').setAttribute('aria-pressed',l==='en');
    var live=window.SKY&&SKY.live;
    var and=document.getElementById('sAndroid');
    if(live&&and.tagName==='A')and.href=SKY.testerMail(l);
    document.title=live?(l==='he'?'SkyTasks, להורדה':'SkyTasks, download'):(l==='he'?'SkyTasks, בקרוב':'SkyTasks, coming soon');
  }
  // Launch day (../launch.js): the iPhone tile opens the App Store, the Android tile the way into the test.
  if(window.SKY&&SKY.live){
    function link(id,href,small,big){
      var d=document.getElementById(id);if(!d)return;
      var a=document.createElement('a');a.className=d.className;a.id=id;a.href=href;a.innerHTML=d.innerHTML;
      var sm=a.querySelector('small'),b=a.querySelector('b');
      sm.setAttribute('data-he',small[0]);sm.setAttribute('data-en',small[1]);
      b.setAttribute('data-he',big[0]);b.setAttribute('data-en',big[1]);
      d.replaceWith(a);
    }
    link('sApple',SKY.appStore,['להורדה ב־App Store','Download on the App Store'],['אייפון ואייפד','iPhone and iPad']);
    // Android is a closed test: the button writes us an email asking to join, and we reply with the link.
    link('sAndroid',SKY.testerMail('he'),['גרסת בדיקה, לבקש הצטרפות במייל','Test version, ask by email'],['אנדרואיד','Android']);
    var m=document.querySelector('meta[name=description]');
    if(m)m.content='SkyTasks: המשימות, היומן והלימודים במקום אחד, ועיר שנבנית ממה שעשית. עכשיו באייפון, ובגרסת בדיקה באנדרואיד.';
  }
  document.getElementById('bHe').onclick=function(){set('he')};
  document.getElementById('bEn').onclick=function(){set('en')};
  set('he');
})();
</script>

</body>
</html>
